<div class="countries-page">

  <!-- Page Header -->
  <div class="page-header">

    <div>
      <h1>List of Countries</h1>

      <p>
        Manage country information and configurations.
      </p>
    </div>

  </div>


  <!-- Country Widget -->
  <div class="countries-grid">

    <div
      class="country-card"
      (click)="openPage()"
    >

      <div class="card-icon">
        <mat-icon>public</mat-icon>
      </div>

      <div class="card-content">

        <h3>List of Countries</h3>

        <p>
          Manage country information
        </p>

      </div>

      <mat-icon class="arrow-icon">
        arrow_forward
      </mat-icon>

    </div>

  </div>

</div>
