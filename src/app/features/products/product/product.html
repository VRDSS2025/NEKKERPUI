<div class="product-page">

  <button
    type="button"
    class="back-button"
    (click)="goBack()"
  >
    <mat-icon>
      arrow_back
    </mat-icon>

    <span>
      Back to Products
    </span>
  </button>


  <app-master-list
    title="Product"
    description="Manage product information."
    icon="inventory_2"
    searchPlaceholder="Search products..."
    [columns]="columns"
    [data]="products"
    (addClicked)="addProduct()"
    (viewClicked)="viewProduct($event)"
  >
  </app-master-list>

</div>
