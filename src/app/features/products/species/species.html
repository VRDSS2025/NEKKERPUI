<div class="species-page">

  <button
    type="button"
    class="back-button"
    (click)="goBack()"
  >

    <mat-icon>
      arrow_back
    </mat-icon>

    <span>
      Back to Products
    </span>

  </button>


  <app-master-list
    title="Product Species"
    description="Manage product species information."
    icon="water"
    searchPlaceholder="Search species..."
    [columns]="columns"
    [data]="species"
    (addClicked)="addSpecies()"
    (viewClicked)="viewSpecies($event)"
  >
  </app-master-list>

</div>
