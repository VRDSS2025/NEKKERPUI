<nav class="navbar">

  <!-- LEFT -->
  <div class="navbar-left">

    <button
      type="button"
      class="menu-button"
      aria-label="Toggle navigation"
      title="Menu"
      (click)="toggleMenu()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <div class="navbar-brand">

      <img
        src="/images/nekkantilogo.jpeg"
        alt="Company Logo"
        class="navbar-logo"
      />

      <span class="company-name">
        Nekkanti ERP
      </span>

    </div>

  </div>


  <!-- RIGHT -->
  <div class="navbar-right">

    <!-- HOME -->
    <button
      type="button"
      class="home-navigation-button"
      aria-label="Go to Home"
      title="Home"
      (click)="goToHome()"
    >
      <mat-icon>home</mat-icon>

      <span>
        Home
      </span>
    </button>


    <!-- PROFILE -->
    <div class="profile-wrapper">

      <button
        type="button"
        class="profile-button"
        aria-label="User profile"
        title="Profile"
        (click)="toggleProfileMenu()"
      >

        <mat-icon class="profile-icon">
          account_circle
        </mat-icon>

        <span class="username">
          Admin
        </span>

        <mat-icon class="dropdown-icon">
          keyboard_arrow_down
        </mat-icon>

      </button>


      @if (profileMenuOpen) {

        <div class="profile-dropdown">

          <button
            type="button"
            class="dropdown-item logout-item"
            (click)="logout()"
          >

            <mat-icon>
              logout
            </mat-icon>

            <span>
              Logout
            </span>

          </button>

        </div>

      }

    </div>

  </div>

</nav>
