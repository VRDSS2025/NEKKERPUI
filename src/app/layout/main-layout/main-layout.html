<div class="main-layout">

  <!-- Navbar -->
  <app-navbar
    (menuToggle)="toggleSidebar()"
  ></app-navbar>


  <!-- Body -->
  <div class="layout-body">

    <!-- Sidebar -->
    @if (sidebarOpen) {
      <app-sidebar></app-sidebar>
    }


    <!-- Main Area -->
    <div class="main-content">

      <main class="page-content">
        <router-outlet></router-outlet>
      </main>

      <!-- Footer -->
      <app-footer></app-footer>

    </div>

  </div>

</div>
